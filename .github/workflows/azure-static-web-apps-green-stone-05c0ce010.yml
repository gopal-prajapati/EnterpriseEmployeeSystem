- name: Set up Node.js
  uses: actions/setup-node@v4
  with:
    node-version: 24

- name: Install dependencies
  working-directory: frontend/employee-ui
  run: npm install

- name: Build Angular app
  working-directory: frontend/employee-ui
  run: npm run build -- --configuration production

- name: Build And Deploy
  id: builddeploy
  uses: Azure/static-web-apps-deploy@v1
  with:
    azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_STONE_05C0CE010 }}
    repo_token: ${{ secrets.GITHUB_TOKEN }}
    action: "upload"

    # Deploy the already-built files
    app_location: "frontend/employee-ui/dist/employee-ui/browser"
    output_location: ""
    skip_app_build: true
