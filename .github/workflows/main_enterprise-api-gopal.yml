name: Build and deploy ASP.NET Core API to Azure Web App - enterprise-api-gopal

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/EnterpriseEmployeeSystem.sln/Employee.Api/Employee.Api.csproj

      - name: Build
        run: dotnet build backend/EnterpriseEmployeeSystem.sln/Employee.Api/Employee.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish backend/EnterpriseEmployeeSystem.sln/Employee.Api/Employee.Api.csproj --configuration Release --output publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-app
          path: publish

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api-app
          path: publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: enterprise-api-gopal
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
