<h2>Employees</h2>

<table border="1" cellpadding="8">
  <thead>
    <tr>
      <th>Id</th>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Email</th>
      <th>Department</th>
      <th>Salary</th>
    </tr>
  </thead>

  <tbody>
  @for (employee of employees(); track employee.id) {
    <tr>
      <td>{{ employee.id }}</td>
      <td>{{ employee.firstName }}</td>
      <td>{{ employee.lastName }}</td>
      <td>{{ employee.email }}</td>
      <td>{{ employee.department }}</td>
      <td>{{ employee.salary }}</td>
    </tr>
  }
</tbody>
</table>
